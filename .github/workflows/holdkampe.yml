name: HØBK holdkampe

on:
  schedule:
    - cron: "17 5 * * *"   # hver morgen ca. 06/07 dansk tid
    - cron: "37 20 * * 0,6" # lørdag + søndag aften, efter weekendens kampe
  workflow_dispatch:
    inputs:
      season:
        description: "Sæson (startår)"
        default: "2026"
      debug:
        description: "Gem rå HTML som artifact (indeholder kontaktinfo — slet efter brug)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hent hold, kampdatoer, resultater og spillere
        env:
          BP_USER: ${{ secrets.BRUGER }}
          BP_PWD: ${{ secrets.BP_PWD }}
        run: |
          python fetch_holdkampe.py \
            --season "${{ github.event.inputs.season || '2026' }}" \
            --club 1151 \
            --pulje 19102:5 \
            --out data/holdkampe.json \
            --dump-dir debug_html

      - name: Gem rå HTML til fejlsøgning
        if: failure() || github.event.inputs.debug == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug_html
          if-no-files-found: ignore
          retention-days: 2

      - name: Commit opdateret JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/holdkampe.json
          if git diff --cached --quiet; then
            echo "Ingen ændringer."
          else
            git commit -m "Opdater holdkampe $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Discord-besked
        if: always() && env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          STATUS: ${{ job.status }}
        run: |
          if [ "$STATUS" = "success" ]; then MSG="✅ HØBK holdkampe opdateret"; else MSG="❌ HØBK holdkampe fejlede — se Actions-loggen"; fi
          curl -sS -m 20 -H "Content-Type: application/json" \
            -d "{\"content\": \"$MSG\"}" "$DISCORD_WEBHOOK" || true
