name: Undersøg badmintonplayer.dk (diag)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Hent turneringssider og metodeliste
        run: python3 discover_turneringer.py
      - name: Push til diag-branch (maskeret)
        run: |
          cd diag
          git init -q -b diag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Undersøgelse $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag
