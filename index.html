<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E2236">
<title>HØBK — ny adresse</title>
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0E2236;color:#fff;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px max(16px,env(safe-area-inset-left)) 24px max(16px,env(safe-area-inset-right));box-sizing:border-box}
.c{max-width:420px;display:flex;flex-direction:column;gap:14px;text-align:center;align-items:center}
img{width:72px;height:72px;border-radius:16px}
h1{margin:0;font-size:22px}
a.b{display:inline-block;background:#D4F25A;color:#0E2236;font-weight:700;text-decoration:none;padding:12px 22px;border-radius:999px}
p{margin:0;color:#C9D4DE}
</style>
</head>
<body>
<div class="c">
  <img src="icon-180.png" alt="">
  <h1>HØBK-appen er flyttet til app.hoebk.dk</h1>
  <p id="s">Du sendes videre …</p>
  <a class="b" id="go" href="https://app.hoebk.dk/">Åbn app.hoebk.dk</a>
  <p style="font-size:14px">Læg den nye adresse på hjemmeskærmen og slet det gamle ikon.</p>
</div>
<script>
(function () {
  var NEW = 'https://app.hoebk.dk/';
  var data = { k: {}, r: location.hash || '' };
  try {   // login og indstillinger tages med, så man ikke skal logge ind igen
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (/^hoebk_[a-z]+$/.test(k) && k !== 'hoebk_akt' && k !== 'hoebk_moved') data.k[k] = localStorage.getItem(k);
    }
  } catch (e) {}
  var url = NEW + '#/flyt/' + encodeURIComponent(JSON.stringify(data));
  if (url.length > 12000) { var me = data.k.hoebk_me; data.k = me ? { hoebk_me: me } : {}; url = NEW + '#/flyt/' + encodeURIComponent(JSON.stringify(data)); }
  document.getElementById('go').href = url;
  var done = false;
  function go() { if (done) return; done = true; location.replace(url); }
  // Afmeld de gamle notifikationer, så ingen får dem dobbelt, når de slår dem til på den nye adresse
  var p = Promise.resolve();
  try {
    if ('serviceWorker' in navigator) p = navigator.serviceWorker.getRegistrations().then(function (regs) {
      return Promise.all(regs.map(function (r) {
        return (r.pushManager ? r.pushManager.getSubscription() : Promise.resolve(null))
          .then(function (s) { return s && s.unsubscribe(); }).catch(function () {})
          .then(function () { return r.unregister(); }).catch(function () {});
      }));
    });
  } catch (e) {}
  p.then(go, go);
  setTimeout(go, 2500);
})();
</script>
</body>
</html>
