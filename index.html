<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HØBK Holdkampe</title>
<meta name="description" content="Hørsholm Badminton Klub — holdkampe, resultater, klubrangliste og spillere.">
<meta name="theme-color" content="#0E2236">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="HØBK">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--akt:#7A4FC9;--tour:#1E6B3A;--ink:#0E2236;--muted:#4A5866;--muted2:#6A7682;--ground:#F7F7F2;--card:#FFFFFF;--line:#E2E5DC;--line2:#EDEFE8;--accent:#D4F25A;--loss:#F3D6D2;--draw:#E7ECF1;--soft:#F1F2EC;--hi:#F4FBD9;--navy2:#1B3550;--seg:#E7EAE1}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit;cursor:pointer}
a{color:var(--ink)}
/* Fast ramme: top og menu ligger fast, kun indholdet ruller (undgår at menuen hopper på iPhone-hjemmeskærmsapps) */
.app{position:fixed;top:0;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:var(--ground);overflow:hidden}
.top{flex:0 0 auto;position:relative;z-index:5;background:var(--ink);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 12px 12px;display:flex;align-items:center;gap:6px;min-height:56px}
.top .back{width:44px;height:44px;flex:0 0 auto;border:0;border-radius:999px;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center}
.top .back:focus-visible{outline:2px solid var(--accent)}
.top .back[hidden]{display:none}
.top .refresh{margin-left:auto;width:44px;height:44px;flex:0 0 auto;border:0;border-radius:999px;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center}
.top .refresh:focus-visible{outline:2px solid var(--accent)}
.top .refresh.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.top .t{display:flex;flex-direction:column;min-width:0;padding-left:8px}
.top.has-back .t{padding-left:0}
.top h1{margin:0;font-family:Archivo,sans-serif;font-weight:800;font-size:21px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:12px;color:#C3CED9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main>*{flex-shrink:0}   /* indholdet må ikke presses sammen nu hvor main har fast højde */
main{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:14px 14px 28px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.row{width:100%;min-height:60px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;font-size:inherit}
button.card:hover{border-color:#C9CEC2}
button.card:focus-visible,.chip:focus-visible,.seg button:focus-visible,nav.tabs a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.col{display:flex;flex-direction:column;min-width:0}
.h{font-family:Archivo,sans-serif;font-weight:800}
.s{font-size:13px;color:var(--muted)}
.xs{font-size:12px;color:var(--muted)}
.lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:8px 4px 0}
.pill{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.mark{border-radius:6px;padding:1px 8px;font-size:12px;font-weight:800}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{padding:10px 12px;display:flex;flex-direction:column}
.tile b{font-family:Archivo,sans-serif;font-weight:800;font-size:21px}
.seg{display:grid;gap:4px;background:var(--seg);border-radius:999px;padding:4px}
.seg button{min-height:40px;border:0;border-radius:999px;background:transparent;font-weight:500;font-size:14px}
.seg button[aria-selected=true]{background:#fff;font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:0 0 auto;min-height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--ink);background:#fff;font-weight:600;font-size:13px}
.chip[aria-pressed=true]{background:var(--ink);color:#fff}
.mrow{width:100%;min-height:60px;padding:10px 12px;display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:#fff;border:1px solid #D6DAD0;border-radius:14px;font-size:inherit}
.mrow.up{border-style:dashed;cursor:default}
.score{font-family:Archivo,sans-serif;font-weight:800;font-size:14px;padding:5px 8px;border-radius:9px;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--muted);font-weight:600;text-align:left;padding:8px 6px}
td{padding:9px 6px;border-top:1px solid var(--line2)}
.r{text-align:right}
.us td{background:var(--hi);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:10px;height:10px;border-radius:999px;display:inline-block}
.av{width:38px;height:38px;flex:0 0 auto;border-radius:999px;display:flex;align-items:center;justify-content:center;font-family:Archivo,sans-serif;font-weight:800;font-size:13px}
.game{padding:10px 12px;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;align-items:center}
.pl{border:0;background:transparent;padding:0;text-align:left;font-size:13px;color:var(--ink)}
.pl.ours{font-weight:700;text-decoration:underline;text-underline-offset:2px}
.pl:disabled{cursor:default;text-decoration:none}
.rk{width:100%;min-height:54px;border:0;border-top:1px solid var(--line2);background:#fff;padding:8px 12px;display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;font-size:inherit}
.rk:first-child{border-top:0}
.rk.top3{background:var(--hi)}
.search{display:flex;align-items:center;gap:8px;padding:0 12px;min-height:46px}
.search input{border:0;outline:0;background:transparent;flex:1 1 auto;font-size:16px;font-family:inherit;color:var(--ink);min-width:0}
nav.tabs{flex:0 0 auto;position:relative;z-index:5;background:#fff;border-top:1px solid var(--line);padding:6px 8px max(8px, calc(env(safe-area-inset-bottom) - 12px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:flex;justify-content:space-evenly;gap:0}
nav.tabs a{flex:0 1 auto;min-width:44px;padding:0 4px;letter-spacing:-.2px;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted2);font-size:12px;font-weight:700;text-decoration:none;border-radius:12px}
nav.tabs a[aria-current=page]{color:var(--ink)}
.empty{margin:6px 4px;color:var(--muted);font-size:14px}
.note{margin:2px 4px;font-size:12px;color:var(--muted)}
.big{font-family:Archivo,sans-serif;font-weight:800;font-size:36px;line-height:1}
.loading{padding:40px 16px;text-align:center;color:var(--muted)}

/* ---- Kalender ---- */
.calbar{display:flex;align-items:center;gap:6px}
.calbar .nav{width:44px;height:44px;flex:0 0 auto;border-radius:999px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center}
.calbar .lab{flex:1 1 auto;text-align:center;font-family:Archivo,sans-serif;font-weight:800;font-size:17px}
.calbar .today{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--ink);background:#fff;font-weight:600;font-size:13px}
.chip[aria-pressed=true] .xs{color:inherit;opacity:.75}
.regchips{display:flex;flex-wrap:wrap;gap:6px;overflow:visible}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filters select{min-height:40px;border-radius:999px;border:1px solid var(--line);background:#fff;padding:0 12px;font-family:inherit;font-size:14px;color:var(--ink);flex:1 1 160px}
.toggle{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:600}
.toggle input{width:18px;height:18px;accent-color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.mgrid .wd{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0}
.mday{min-height:74px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:4px 3px;display:flex;flex-direction:column;gap:2px;text-align:left;font-size:inherit;overflow:hidden}
.mday.out{background:transparent;border-color:transparent;color:#A3ADB6}
.mday.now{border:2px solid var(--ink)}
.mday .n{font-size:12px;font-weight:700;padding-left:2px}
.bar{display:block;border-radius:4px;padding:1px 3px;font-size:10px;font-weight:700;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar.tr{background:transparent!important;border:1px dashed #9AA6B1;color:var(--muted);font-weight:600}
.more{font-size:10px;color:var(--muted);padding-left:2px}
.ev{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;width:100%;text-align:left;font-size:inherit;background:#fff;border:1px solid var(--line);border-left-width:5px;border-radius:14px}
.ev.tr{border-style:dashed;border-left-style:solid;background:#FBFBF8}
.ev .tm{font-family:Archivo,sans-serif;font-weight:800;font-size:15px;line-height:1.1}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;margin:10px 4px 0}
.dayhead b{font-size:14px}
.dayhead.now b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.ygrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:480px){.ygrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ymon{padding:8px;border-radius:14px}
.ymon h3{margin:0 0 4px 2px;font-size:13px;font-family:Archivo,sans-serif;display:flex;justify-content:space-between}
.ymon h3 span{font-family:Inter,sans-serif;font-weight:600;color:var(--muted);font-size:11px}
.yg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px}
.yd{aspect-ratio:1;border:0;background:transparent;padding:0;font-size:9px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:5px}
.yd.has{color:var(--ink);font-weight:700;background:var(--soft)}
.yd.now{outline:1.5px solid var(--ink)}
.yd i{width:5px;height:5px;border-radius:999px;display:block}

/* ---- Tilmelding ---- */
.reg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rb{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--ink);background:#fff;font-weight:700;font-size:13px}
.rb[aria-pressed=true].ja{background:var(--accent);border-color:var(--accent)}
.rb[aria-pressed=true].nej{background:var(--loss);border-color:#E3B4AD}
.rb[aria-pressed=true].maaske{background:#FFE3C2;border-color:#F3C58F}
.rb:disabled{opacity:.6}
.rb.follow{align-self:flex-start;min-height:44px;font-size:14px}
.rb.follow[aria-pressed=true]{background:var(--accent);border-color:var(--accent)}
.star{color:#C99A06}
.news{color:var(--tour,#1E6B3A);font-weight:600}
.pagec{padding:14px 16px;font-size:15px;line-height:1.55;overflow-wrap:anywhere}
.pagec h1{font-size:21px;line-height:1.2;margin:4px 0 10px}.pagec h2{font-size:18px;margin:16px 0 6px}.pagec h3,.pagec h4{font-size:16px;margin:14px 0 4px}
.pagec p{margin:0 0 10px}.pagec img{max-width:100%;height:auto;border-radius:8px}.pagec a{color:#2F6FB3;font-weight:600}
.pagec table{border-collapse:collapse;display:block;overflow-x:auto;max-width:100%;font-size:13px}.pagec td,.pagec th{border:1px solid var(--line);padding:4px 6px;vertical-align:top}
.pagec ul,.pagec ol{padding-left:20px;margin:0 0 10px}
.sgroup{padding:4px 0}.sgroup a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 14px;border-top:1px solid var(--line2);color:inherit;text-decoration:none;font-size:15px}
.sgroup a:first-of-type{border-top:0}.newdot{font-size:11px;font-weight:800;color:#1E5A2E;background:#E3F3E6;border-radius:999px;padding:2px 7px;white-space:nowrap}
.route{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:14px;text-decoration:none;align-self:flex-start}
.route svg{flex:none}
.tlinks{display:flex;flex-wrap:wrap;gap:8px}
.rb.tlink{display:inline-flex;align-items:center;min-height:44px;text-decoration:none;color:var(--ink);font-size:14px}
.drive{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.cnt{font-size:12px;color:var(--muted);margin-left:auto}
.who summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--ink);padding:4px 0;list-style-position:inside}
.who ul{margin:4px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px}
.who li{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--soft)}
.who li.ja{background:var(--hi)}
.who li.nej{background:#FBEDEB;color:#6B3A33}
.who li.maaske{background:#FFF2E2}
.evwrap{display:flex;flex-direction:column;gap:8px;background:#fff;border:1px solid var(--line);border-left:5px solid #9AA6B1;border-radius:14px;padding:10px 12px}
.evwrap.tr{border-style:dashed;border-left-style:solid;background:#FBFBF8}
.evwrap .evtop{display:grid;grid-template-columns:66px minmax(0,1fr) auto;gap:10px;align-items:center;background:transparent;border:0;padding:0;text-align:left;font-size:inherit;width:100%}
.me{display:flex;align-items:center;gap:10px;padding:10px 12px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:90vw}
.toast[hidden]{display:none}

/* ---- Turneringer ---- */
.tcard{display:grid;grid-template-columns:66px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:10px 12px;text-align:left;font-size:inherit;background:#fff;border:1px solid var(--line);border-left:5px solid var(--tour);border-radius:14px}
.tdate{display:flex;flex-direction:column;line-height:1.2}
.tdate b{font-family:Archivo,sans-serif;font-size:15px}
.cls{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:#E2F1E6;color:#124526;margin:2px 4px 0 0}
.cls.fit{background:var(--tour);color:#fff}
.dl{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.dl.open{background:var(--hi);color:var(--ink)}
.dl.closed{background:var(--soft);color:var(--muted)}
.lvhead{display:flex;justify-content:space-between;align-items:baseline;margin:12px 4px 0}
.lvhead b{font-family:Archivo,sans-serif;font-size:16px}

/* ---- Holdopstilling ---- */
.pick{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;min-height:54px;padding:8px 12px;text-align:left;font-size:inherit;background:#fff;border:1px solid var(--line);border-radius:14px}
.pick[aria-pressed=true]{border-color:var(--ink);background:var(--hi)}
.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.pick[aria-pressed=true] .box{background:var(--ink);color:#fff}
.av-ja{background:var(--accent)} .av-maaske{background:#FFE3C2} .av-nej{background:var(--loss)} .av-none{background:var(--soft);color:var(--muted)}
.savebar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));z-index:4;display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--ink);color:#fff;border-radius:16px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.savebar .rb{border-color:#fff;background:var(--accent);color:var(--ink)}
.slot{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line2)}
.slot:first-child{border-top:0}
.slot select{width:100%;min-height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;font-family:inherit;font-size:14px;padding:0 8px;color:var(--ink)}
.warn{font-size:12px;color:#8A4B00;background:#FFF2E2;border-radius:10px;padding:8px 10px}
/* Snak + nyheder */
nav.tabs a{position:relative}
nav.tabs a .dot{position:absolute;top:8px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:#D93A2B;border:2px solid #fff}
.badge{min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--ink);color:#fff;font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.news{width:100%;text-align:left;padding:12px 14px;display:flex;flex-direction:column;gap:3px;font-size:inherit}
.news.new{border-left:5px solid var(--accent)}
.news.plan{border-left:5px solid var(--akt)}
.need{color:#8A4B00}
.news b{font-size:15px;color:var(--ink)}
.newtag{color:var(--ink);background:var(--accent);border-radius:6px;padding:0 6px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.snakbar{display:flex;align-items:center;gap:10px}
.chip.mute.on{background:#1E8A4C;border-color:#1E8A4C;color:#fff}
.chip.mute.off{background:#C8352B;border-color:#C8352B;color:#fff}
.msgs{flex:1 0 auto;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;padding-bottom:4px}
.msgday{align-self:center;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 4px}
.msg{max-width:84%;align-self:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:7px 12px;display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--hi);border-color:#DCEBA5;border-radius:16px 16px 4px 16px}
main.chat{padding-bottom:0}
.msg.pending{opacity:.6}
.msg .who2{font-size:12px;font-weight:700;color:var(--muted)}
.msg.me .who2{align-self:flex-end}
.msg .par{font-weight:700;font-size:11px;color:#fff;background:#5F7D0F;border-radius:6px;padding:1px 6px;margin-left:4px;white-space:nowrap}
.msg .txt{font-size:15px;line-height:1.4}
.msg .meta{align-self:flex-end;font-size:11px;color:var(--muted2);display:flex;gap:8px;align-items:center}
.msg .del{border:0;background:none;padding:2px 0;font-size:11px;color:var(--muted);text-decoration:underline;min-height:24px}
.compose{position:sticky;bottom:0;margin:0 -14px;padding:8px 14px 10px;background:var(--ground);border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end}
.compose textarea{flex:1 1 auto;min-height:44px;max-height:160px;resize:none;border:1px solid var(--line);border-radius:22px;padding:11px 14px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
.compose .rb{min-height:44px;flex:0 0 auto}
.inp{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px;background:#fff;color:var(--ink);width:100%}
textarea.inp{resize:vertical;line-height:1.45}
.err{font-size:12px;color:#7A1A12;background:#FBE1DD;border-radius:10px;padding:8px 10px}
.okmsg{font-size:12px;color:#1E5A2E;background:#E3F3E6;border-radius:10px;padding:8px 10px}
.infomsg{font-size:12px;color:#3C4A57;background:#EEF1F4;border-radius:10px;padding:8px 10px}
.st{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.st-udkast{background:var(--soft)} .st-klar{background:#FFE3C2} .st-indtastet{background:var(--accent)}
.brand{flex:none;width:40px;height:43px;padding:3px 4px;background:#fff;border-radius:10px;object-fit:contain;box-sizing:border-box}
.back:not([hidden])+.brand{display:none}
</style>
</head>
<body>
<div class="app">
<header class="top" id="top">
<button class="back" id="back" aria-label="Tilbage" hidden>
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
</button>
<img class="brand" src="logo.png" alt="Hørsholm Badminton Klub" width="40" height="43">
<div class="t"><h1 id="title">HØBK</h1><span class="sub" id="subtitle">Henter data …</span></div>
<button class="refresh" id="refresh" aria-label="Opdater data"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg></button>
</header>
<main id="main"><div class="loading">Henter holdkampe …</div></main>
<nav class="tabs" aria-label="Faner"><div class="in">
<a href="#/nyt" data-tab="nyt"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h13v14a2 2 0 0 0 2 2H6a2 2 0 0 1-2-2z"/><path d="M17 9h3v10a2 2 0 0 1-2 2"/><path d="M8 9h5M8 13h5M8 17h3"/></svg>Nyt</a>
<a href="#/hold" data-tab="hold"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Hold</a>
<a href="#/kalender" data-tab="kalender"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Kalender</a>
<a href="#/tilmeld" data-tab="tilmeld"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Min side</a>
<a href="#/spillere" data-tab="spillere"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M16 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3"/></svg>Spillere</a>
<a href="#/sider" data-tab="sider"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h10l6 6v10a0 0 0 0 1 0 0H4z"/><path d="M14 4v6h6M8 14h8M8 18h6"/></svg>Sider</a>
</div></nav>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
  'use strict';
  // ---- App-version: find ud af om index.html er ændret på serveren ----
  // Telefoner (især "Føj til hjemmeskærm" på iPhone) gemmer siden og genåbner den uden at hente den igen.
  // Vi sammenligner appens egen kode (script + stylesheet) med den nyeste udgave på GitHub Pages.
  var SELF = document.currentScript;
  function codeSig(doc, script) {
    var txt = Array.prototype.map.call(doc.querySelectorAll('style'), function (x) { return x.textContent; }).join('') + (script ? script.textContent : '');
    var h = 5381; for (var i = 0; i < txt.length; i++) h = ((h << 5) + h + txt.charCodeAt(i)) | 0;
    return txt.length + ':' + (h >>> 0).toString(36);
  }
  var MY_SIG = codeSig(document, SELF);
  try {   // fjern ?v=… fra adresselinjen efter en opdatering
    var APP_RELOAD = /[?&]v=/.test(location.search);   // genindlæst pga. ny version — bliv på samme skærm
    if (/[?&]v=/.test(location.search)) history.replaceState(null, '', location.pathname + location.hash);
  } catch (e) {}
  function checkAppVersion(fromButton) {
    return fetch('index.html?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }).then(function (html) {
      if (!html) return false;
      var doc = new DOMParser().parseFromString(html, 'text/html');
      var scripts = Array.prototype.slice.call(doc.querySelectorAll('script')).sort(function (a, b) { return b.textContent.length - a.textContent.length; });
      var sig = codeSig(doc, scripts[0]);
      if (sig === MY_SIG) return false;
      var tried = ''; try { tried = sessionStorage.getItem('hoebk_reload') || ''; } catch (e) {}
      if (tried === sig && !fromButton) return false;   // undgå genindlæsnings-løkke hvis serveren endnu ikke er helt opdateret
      try { sessionStorage.setItem('hoebk_reload', sig); } catch (e) {}
      location.replace(location.pathname + '?v=' + Date.now() + location.hash);
      return true;
    }).catch(function () { return false; });
  }
  var ORDER = ['Danmarksserien', 'Serie 2', '4 Spillere', '4 Spillere A-række', 'MOT 4+4 Elite/Mester',
    'MOT 4+4 Serie 3-4', 'MOT 4 spillere Mester', 'U15 A', 'U15 B', 'U13 A', 'U13 B', 'U13 C-D', 'U13 D', 'U11 C', 'U11 Dx'];
  var MONS = ['jan', 'feb', 'mar', 'apr', 'maj', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];
  var DAYS = ['sø', 'ma', 'ti', 'on', 'to', 'fr', 'lø'];
  // Farve på spillerens cirkel = rækken spilleren har flest kampe i (samme farver som kalenderen).
  // Forældre: mørk ungdomsgrøn. Spillere uden holdkampe og uden niveau: grå.
  var PARENT = { bg: '#5F7D0F', fg: '#FFFFFF' };
  var NOLEVEL = { bg: '#C9CED3', fg: '#0E2236' };
  function isParentId(id) { return /^p:/.test(String(id || '')); }
  function playerColor(p) {
    if (!p) return NOLEVEL;
    if (!p.teams || !p.teams.length) {   // ingen holdkampe: ud fra rangliste-niveau (U… = ungdom, SEN… = senior)
      var lv = (typeof playerLevels === 'function' ? playerLevels(p) : [])[0] || ((p.profile || {}).level || '');
      return /^U\d/.test(lv) ? teamColor('U15') : /^(SEN|MOT|VET|\+)/.test(lv) ? teamColor('Serie') : NOLEVEL;
    }
    var n = {}; (p.games || []).forEach(function (g) { n[g.team] = (n[g.team] || 0) + 1; });
    var main = p.teams.slice().sort(function (a, b) { return (n[b] || 0) - (n[a] || 0); })[0];
    return teamColor(main);
  }
  function hasRank(p) { var pr = p.profile || {}; return !!((pr.rankings && pr.rankings.length) || pr.level); }
  // Filter i spillerlisten (huskes på telefonen)
  var PF = { alle: ['Alle', function () { return true; }], spillet: ['Har spillet', function (p) { return p.played > 0; }],
             rang: ['Har rangering', hasRank], uden: ['Uden rangering', function (p) { return !hasRank(p); }] };
  function isActive(p) {   // har spillet holdkamp i år eller har et niveau/rangliste på badmintonplayer.dk
    var pr = p.profile || {};
    return !!(p.played || (pr.rankings && pr.rankings.length) || pr.level);
  }
  function teamsTxt(p) {   // "U15 B, Serie 2" — eller niveau for spillere uden holdkampe
    if (p.teams && p.teams.length) return p.teams.join(', ');
    var lv = (typeof playerLevels === 'function' ? playerLevels(p) : []);
    return (lv.length ? lv.join(', ') + ' · ' : '') + 'ingen holdkampe i år';
  }
  function avStyle(p) { var c = playerColor(p); return 'background:' + c.bg + ';color:' + c.fg; }
  function colorLegend() {
    return '<div class="legend">' + [['Senior', '#2F6FB3'], ['4 spillere', '#7FD3F7'], ['Motion', '#E58A2E'], ['Ungdom', '#D4F25A'], ['Forælder', PARENT.bg], ['Uden niveau', NOLEVEL.bg]].map(function (x) {
      return '<span><i style="background:' + x[1] + '"></i>' + x[0] + '</span>'; }).join('') + '</div>';
  }
  var METRICS = { won: ['Vundne kampe', 'won', 'vundet'], pct: ['Sejr %', 'winPct', '%'],
                  pf: ['Point i alt', 'pointsFor', 'point'], avg: ['Snit pr. kamp', 'avgPoints', 'point/kamp'] };

  var D = null;            // { teams, players: {id: p}, ids, clubRank: {id: n}, updated }
  var UI = { metric: 'won', filter: 'alle', q: '', seg: 'kampe' };
  var $main = document.getElementById('main');

  var FORCE = 0;   // sættes af opdater-knappen, så alt hentes helt friskt
  function bustParam(ms) { return '?t=' + (FORCE || Math.floor(Date.now() / ms)); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function dTxt(x) { var p = x.split('-'); var dt = new Date(+p[0], +p[1] - 1, +p[2]); return DAYS[dt.getDay()] + ' ' + (+p[2]) + '. ' + MONS[+p[1] - 1]; }
  function ini(n) { var p = n.trim().split(/\s+/); return (p[0] || '').charAt(0) + (p.length > 1 ? p[p.length - 1].charAt(0) : ''); }
  function oBg(o) { return o === 'V' ? 'var(--accent)' : o === 'T' ? 'var(--loss)' : 'var(--draw)'; }
  function oTxt(o) { return o === 'V' ? 'Sejr' : o === 'T' ? 'Nederlag' : o === 'U' ? 'Uafgjort' : ''; }
  function flipScore(s) { return s ? s.split('-').reverse().join('-') : s; }
  function setsTxt(sets) { return sets.map(function (x) { return x[0] + '-' + x[1]; }).join(' '); }

  function load() {
    var bust = bustParam(60000);
    return Promise.all([fetch('data/holdkampe.json' + bust).then(function (r) { return r.json(); }),
                        fetch('data/spillere.json' + bust).then(function (r) { return r.json(); }),
                        fetch('data/traening.json' + bust).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }),
                        fetch('data/turneringer.json' + bust).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }),
                        fetch('data/turnering_nyt.json' + bust).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })])
      .then(function (res) {
        var hk = res[0], sp = res[1], tr = res[2], tu = res[3], nyt = res[4] || {};
        var teams = hk.teams.slice().sort(function (a, b) {
          var ia = ORDER.indexOf(a.label), ib = ORDER.indexOf(b.label);
          return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
        });
        var players = {};
        sp.players.forEach(function (p) { if (p.id) players[p.id] = p; });
        var ids = Object.keys(players);
        var overall = ids.filter(function (id) { return players[id].played; }).sort(function (a, b) { var A = players[a], B = players[b];
          return (B.won - A.won) || (B.winPct - A.winPct) || (B.pointsFor - A.pointsFor) || A.name.localeCompare(B.name, 'da'); });
        var clubRank = {}; overall.forEach(function (id, i) { clubRank[id] = i + 1; });
        D = { teams: teams, players: players, ids: ids, clubRank: clubRank, updated: sp.updated || hk.updated, training: tr, tours: (tu && tu.tournaments) || [], toursUpdated: tu && tu.updated,
              tourNews: nyt.tournaments || {}, tourAlias: nyt.alias || {} };
        migrateFollows();
        buildEvents();
      });
  }

  function updTxt() {
    var u = new Date(D.updated);
    return 'opdateret ' + u.getDate() + '. ' + MONS[u.getMonth()] + ' ' + ('0' + u.getHours()).slice(-2) + ':' + ('0' + u.getMinutes()).slice(-2);
  }

  function setHeader(title, sub, back) {
    document.getElementById('title').textContent = title;
    document.getElementById('subtitle').textContent = sub;
    var b = document.getElementById('back');
    b.hidden = !back;
    document.getElementById('top').classList.toggle('has-back', !!back);
    document.title = title + ' · HØBK';
  }
  function setTab(tab) {
    document.querySelectorAll('nav.tabs a').forEach(function (a) {
      if (a.getAttribute('data-tab') === tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
  }

  // ---------- Views ----------
  function viewHoldList() {
    setTab('hold'); setHeader('Holdkampe', D.teams.length + ' hold · ' + updTxt(), false);
    return D.teams.map(function (t, i) {
      var played = t.matches.filter(function (m) { return m.played; });
      var last = played[played.length - 1];
      var next = t.matches.filter(function (m) { return !m.played; })[0];
      var chip = last ? esc(last.isHome ? last.result : flipScore(last.result)) + ' ' + esc(last.outcome) : (next ? 'Næste ' + dTxt(next.date) : '–');   // score fra Hørsholms side
      return '<button class="card row" data-go="#/hold/' + i + '">' +
        '<span class="col"><span class="h" style="font-size:17px">' + (isFollowed(teamFid(t)) ? '<span class="star" aria-label="Følger">★</span> ' : '') + esc(t.label) + '</span>' +
        '<span class="s">' + esc(t.name) + ' · nr. ' + esc(+t.position ? t.position : '–') + ' af ' + t.standing.length + '</span></span>' +
        '<span class="pill" style="background:' + (last ? oBg(last.outcome) : 'var(--soft)') + '">' + chip + '</span></button>';
    }).join('');
  }

  function viewTeam(ti) {
    var t = D.teams[ti]; if (!t) return viewHoldList();
    setTab('hold'); setHeader(t.label, t.name + ' · ' + t.pulje, true);
    var me = t.standing.filter(function (r) { return r.isUs; })[0] || {};
    var played = t.matches.filter(function (m) { return m.played; }).length;
    var h = '<div class="tiles">' +
      '<div class="card tile"><span class="lbl" style="margin:0">Placering</span><b>' + esc(t.position || '–') + ' / ' + t.standing.length + '</b></div>' +
      '<div class="card tile"><span class="lbl" style="margin:0">Point</span><b>' + esc(me.points || '–') + '</b></div>' +
      '<div class="card tile"><span class="lbl" style="margin:0">Spillet</span><b>' + played + '/' + t.matches.length + '</b></div></div>';
    if (REG.url) h += '<div style="display:flex;align-items:center;gap:10px;margin:2px 0 4px"><button class="rb follow" data-follow="' + esc(teamFid(t)) + '" aria-pressed="' + isFollowed(teamFid(t)) + '">' +
      (isFollowed(teamFid(t)) ? '★ Følger holdet' : '☆ Følg holdet') + '</button><span class="xs" style="flex:1">' +
      (isFollowed(teamFid(t)) ? 'Besked 3 dage før og på kampdagen, ved resultater og hvis en kamp flyttes.' : 'Få besked før kampe, ved resultater og ændringer.') + '</span></div>';
    var troom = ME && ME.token ? roomFor(t) : null;
    if (troom) h += '<button class="card row" style="min-height:52px" data-go="#/snak/' + encodeURIComponent(troom.id) + '"><span class="col"><b style="font-size:14px">💬 Holdets snak</b>' +
      '<span class="xs ellip">' + (troom.last ? esc(troom.by.split(' ')[0] + ': ' + troom.x) : 'Skriv til holdet') + '</span></span>' + (unread(troom) ? '<span class="badge">' + unread(troom) + '</span>' : '<span class="xs">›</span>') + '</button>';
    h += '<div class="seg" role="tablist" style="grid-template-columns:repeat(3,minmax(0,1fr))">' +
      [['kampe', 'Kampe'], ['stilling', 'Stilling'], ['spillere', 'Spillere']].map(function (s) {
        return '<button role="tab" aria-selected="' + (UI.seg === s[0]) + '" data-seg="' + s[0] + '">' + s[1] + '</button>';
      }).join('') + '</div>';
    if (UI.seg === 'kampe') {
      h += t.matches.map(function (m, mi) {
        var where = (m.isHome ? 'Hjemme' : 'Ude') + (!m.played && driveShort(m) ? ' · ' + driveShort(m) : '') + ' · ' + m.venue + (m.walkover ? ' · ' + m.walkover : '');
        var inner = '<span class="col"><b style="font-size:13px">' + dTxt(m.date) + '</b><span class="xs">' + esc(m.time || '') + '</span></span>' +
          '<span class="col"><span style="font-weight:600;font-size:14px">' + (m.isHome ? 'mod ' : '@ ') + esc(m.opponent) + '</span><span class="xs ellip">' + esc(where) + '</span></span>' +
          '<span class="score" style="background:' + (m.played ? oBg(m.outcome) : 'var(--soft)') + '">' + (m.played ? esc(m.result) : regChip(matchEid(m))) + '</span>';
        return '<button class="mrow' + (m.played ? '' : ' up') + '" style="cursor:pointer" data-go="#/hold/' + ti + '/kamp/' + mi + '">' + inner + '</button>';
      }).join('');
    } else if (UI.seg === 'stilling') {
      h += '<div class="card" style="overflow:hidden"><table><thead><tr><th style="padding-left:10px">#</th><th>Hold</th><th class="r">K</th><th class="r">Score</th><th class="r" style="padding-right:10px">P</th></tr></thead><tbody>' +
        t.standing.map(function (r) {
          return '<tr class="' + (r.isUs ? 'us' : '') + '"><td style="padding-left:10px">' + esc(r.pos) + '</td><td>' + esc(r.team) + '</td><td class="r">' + esc(r.played) +
            '</td><td class="r">' + esc(r.score) + '</td><td class="r" style="padding-right:10px;font-weight:700">' + esc(r.points) + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    } else {
      var ps = t.players.filter(function (p) { return D.players[p.id]; });
      h += ps.length ? ps.map(function (p, i) {
        var P = D.players[p.id];
        return '<button class="card row" style="min-height:56px;padding:10px 12px" data-go="#/spiller/' + esc(p.id) + '">' +
          '<span class="av" style="' + avStyle(P) + '">' + esc(ini(P.name)) + '</span>' +
          '<span class="col" style="flex:1 1 auto"><b style="font-size:14px">' + esc(P.name) + '</b><span class="xs">' + p.games + ' kampe for holdet · ' + p.won + ' vundet</span></span>' +
          '<span class="h" style="font-size:15px">' + P.winPct + '%</span></button>';
      }).join('') : '<p class="empty">Spillerlisten bygges op efter holdets første kamp.</p>';
    }
    return h;
  }

  function viewMatch(ti, mi) {
    var t = D.teams[ti], m = t && t.matches[mi]; if (!m) return viewTeam(ti);
    setTab(lastTab === 'kalender' || lastTab === 'tilmeld' ? lastTab : 'hold');
    setHeader((m.isHome ? 'mod ' : '@ ') + m.opponent, t.label + ' · ' + dTxt(m.date), true);
    if (!m.played) {
      var eid = matchEid(m);
      return '<div class="card" style="padding:16px;display:flex;flex-direction:column;gap:8px">' +
        '<span class="lbl" style="margin:0">' + esc(t.label) + ' · ' + esc(t.name) + ' · ' + (m.isHome ? 'Hjemmekamp' : 'Udekamp') + '</span>' +
        '<span class="h" style="font-size:22px;line-height:1.15">' + esc(m.home) + ' – ' + esc(m.away) + '</span>' +
        '<span style="font-weight:600">' + DAY_FULL[parseD(m.date).getDay()] + ' ' + dTxt(m.date).split(' ').slice(1).join(' ') + ' kl. ' + esc(m.time || '') + '</span>' +
        '<span class="s">' + esc(m.venue) + (m.organiser ? ' · arrangør ' + esc(m.organiser) : '') + '</span>' +
        (driveTxt(m) ? '<span class="drive">' + CAR + esc(driveTxt(m)) + (m.travel.min > 3 ? ' fra Hørsholm' : '') + '</span>' : '') +
        routeBtn(mapsDest(m)) + '</div>' +
        '<span class="lbl">Kan du spille?</span>' + regBlock('match', eid, t.label + ' ' + (m.isHome ? 'mod ' : '@ ') + m.opponent + ' ' + m.date, true) +
        lineupSection(ti, mi);
    }
    var pts = m.points ? (m.isHome ? m.points : flipScore(m.points)) : '';
    var h = '<div class="card" style="padding:16px;display:flex;flex-direction:column;gap:10px">' +
      '<span class="xs" style="font-weight:600">' + dTxt(m.date) + ' kl. ' + esc(m.time || '') + ' · ' + esc(m.venue) + '</span>' +
      '<div style="display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;text-align:center">' +
      '<span style="font-weight:' + (m.isHome ? 800 : 500) + ';font-size:14px">' + esc(m.home) + '</span><span class="big">' + esc(m.result) + '</span>' +
      '<span style="font-weight:' + (m.isHome ? 500 : 800) + ';font-size:14px">' + esc(m.away) + '</span></div>' +
      '<span class="pill" style="align-self:center;background:' + oBg(m.outcome) + ';font-size:13px">' + oTxt(m.outcome) + (pts ? ' · ' + esc(pts) + ' point' : '') + '</span></div>';
    var ourSide = m.isHome ? 'home' : 'away', theirSide = m.isHome ? 'away' : 'home';
    function names(list, ours) {
      return list.map(function (x) {
        var ok = ours && x.id && D.players[x.id];
        return ok ? '<button class="pl ours" data-go="#/spiller/' + esc(x.id) + '">' + esc(x.name) + '</button>'
                  : '<span class="pl" style="font-weight:' + (ours ? 700 : 400) + '">' + esc(x.name) + '</span>';
      }).join('<span class="xs"> / </span>');
    }
    if (m.games && m.games.length) {
      h += m.games.map(function (g) {
        var won = g.winner === ourSide;
        var sets = g.sets.map(function (s) { return m.isHome ? s : [s[1], s[0]]; });
        return '<div class="card game"><span class="h" style="font-size:14px">' + esc(g.discipline) + '</span>' +

        pick = withPts.filter(function (x) { return x.g === 'M'; }).slice(0, nb).concat(withPts.filter(function (x) { return x.g === 'K'; }).slice(0, 2));
        var need = nb + 2;
      } else { pick = withPts.slice(0, 4); need = 4; }
      var miss = Math.max(0, need - pick.length);
      var sum = pick.reduce(function (s2, x) { return s2 + x.pts; }, 0) + miss * Math.round(R.maxTeam * 0.2);
      if (sum > R.maxTeam) add('fejl', 'Holdet har ' + sum + ' niveaupoint — maks. ' + R.maxTeam + ' i ' + t.label + ' (§9).');
      else if (!unknown.length) add('ok', 'Niveaupoint ' + sum + ' af maks. ' + R.maxTeam + (miss ? ' (inkl. ' + miss + ' manglende spiller' + (miss > 1 ? 'e' : '') + ' à 20 %)' : '') + '.');
      if (R.best) withPts.forEach(function (x) {
        var lim = R.best.all || R.best[x.g];
        if (lim && x.pts > lim) add('fejl', pname(x.id) + ' har ' + x.pts + ' niveaupoint — bedste spiller må højst have ' + lim + ' i ' + t.label + ' (§9).');
      });
      if (unknown.length) add('info', 'Niveaupoint mangler for ' + unknown.map(function (x) { return pname(x.id); }).join(', ') + ' — tjek pointloftet selv.');
      // 5. Aldersgrupper (§8)
      var teamAgeIx = AGE_ORDER.indexOf(R.age);
      var older = ids.filter(function (id) { var a = AGE_ORDER.indexOf(ageOf(id)); return a > teamAgeIx; });
      if (older.length > 1) add('fejl', 'Kun 1 spiller fra aldersgruppen over må spille — her: ' + older.map(pname).join(', ') + ' (§8).');
      older.forEach(function (id) { var a = ageOf(id); if (a === 'SEN' || AGE_ORDER.indexOf(a) - teamAgeIx > 1 || (a === 'U19' && R.age === 'U15')) add('fejl', pname(id) + ' (' + a + ') må ikke spille ' + R.age + ' (§8).'); });
    }
    // 6. Samme runde på flere hold
    if (m) {
      var md = parseD(m.date);
      Object.keys(REG.lineups || {}).forEach(function (e) {
        if (e === matchEid(m)) return;
        var o = matchByEid(e); if (!o || o.t === t) return;
        if (Math.abs((parseD(o.m.date) - md) / 86400000) > 1) return;
        var other = {}; (REG.lineups[e].games || []).forEach(function (g) { (g.p || []).forEach(function (id) { other[id] = 1; }); });
        (REG.lineups[e].squad || []).forEach(function (p) { other[p.id] = 1; });
        ids.filter(function (id) { return other[id]; }).forEach(function (id) {
          if (R.youth) add('adv', pname(id) + ' er også sat på ' + o.t.label + ' samme runde — tilladt som reserve, men skal stå på holdsedlen (§17).');
          else add('fejl', pname(id) + ' er også sat på ' + o.t.label + ' samme runde — kun ét hold pr. runde, undtagen reserve efter §43 (§45).');
        });
      });
    }
    var empty = games.filter(function (g) { return g.p.filter(String).length < (isDouble(g.k) ? 2 : 1); }).length;
    if (empty) add('adv', empty + ' kamp' + (empty === 1 ? '' : 'e') + ' mangler spillere.');
    if (R.regional) add('info', t.label + ' er en kredsturnering med egne regler. Appen tjekker kun køn, dobbelt brug af spillere og flere hold samme runde — ikke rækkefølge eller antal kampe.');
    return out;
  }

  var SNAK = { rooms: null, news: [], pub: null, pubAt: 0, canNews: false, at: 0, loading: false, msgs: {}, draft: {}, sending: false, adm: null, nf: null, off: false };
  var SEEN = {}, NSEEN = {};

  function saveSeen() { try { localStorage.setItem('hoebk_seen', JSON.stringify(SEEN)); localStorage.setItem('hoebk_nseen', JSON.stringify(NSEEN)); } catch (e) {} }
  function onChatRoom() { return /^#\/snak\/./.test(location.hash); }

  function fetchMsgs(room, quiet) {
    var M = SNAK.msgs[room];
    if (M && M.loading) return;
    if (M) M.loading = true; else SNAK.msgs[room] = M = { loading: true, list: null };
    api({ action: 'messages', token: ME.token, room: room }).then(function (r) {
      var old = SNAK.msgs[room] || {};
      if (r && r.ok) {
        var pend = (old.list || []).filter(function (m) { return m.pending; });
        var sig = function (l) { return (l || []).map(function (m) { return m.id; }).join(','); };
        var changed = sig(old.list) !== sig(r.messages);
        SNAK.msgs[room] = { list: r.messages.concat(pend), canMod: !!r.canMod, muted: !!r.muted };
        if (curRoom() !== room) return;
        if (quiet && old.list && document.getElementById('msgs')) { if (changed) refreshMsgs(room); }
        else { route(true); scrollBottom(); markSeen(room); }
      } else if (r && r.error === 'login') { ME = null; saveMe(); route(); }
      else { SNAK.msgs[room] = old.list ? (old.loading = false, old) : { error: (r && r.error === 'Ukendt handling') ? 'Klubbens server skal opdateres, før snakken virker' : ((r && r.error) || 'Kunne ikke hente beskeder') }; if (!quiet && curRoom() === room) route(true); }
    }).catch(function () {
      var o = SNAK.msgs[room];

    });

  function sendMsg() {

    var M = SNAK.msgs[room], tmp = { id: 'tmp' + Date.now(), t: Date.now(), p: ME.id, n: ME.name, x: text, mine: true, pending: true, k: myKidsIn(room) };
    M.list.push(tmp); SNAK.sending = true; SNAK.draft[room] = ''; ta.value = ''; ta.style.height = '';
    refreshMsgs(room); scrollBottom();
    api({ action: 'post', token: ME.token, room: room, text: text }).then(function (r) {
      if (r && r.error === 'login') { ME = null; saveMe(); throw new Error('Log ind igen'); }

      if (!r.message.k && tmp.k) r.message.k = tmp.k;
      var i = M.list.indexOf(tmp); if (i >= 0) M.list[i] = r.message;
      var rr = (SNAK.rooms || []).filter(function (x) { return x.id === room; })[0];
      if (rr) { rr.last = r.message.t; rr.by = ME.name; rr.x = text.slice(0, 80); rr.n++; }

  // ---------- Aktiviteter (administrator planlægger, spillere og forældre tager opgaver) ----------
  // Tider er lokal tid "YYYY-MM-DDTHH:MM". Hentes fra scriptet (acts) — uden login kun aktiviteter for alle, uden navne.
  var PLAN = { list: null, canEdit: false, at: 0, loading: false, form: null, saving: false, busy: {} };
  function nowLocal() { var d = new Date(); return iso(d) + 'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
  function loadActs(force) {
    if (!REG.url || PLAN.loading || PLAN.off) return Promise.resolve();
    if (!force && PLAN.list && Date.now() - PLAN.at < 60000) return Promise.resolve();
    PLAN.loading = true;
    var req = ME && ME.token ? api({ action: 'acts', token: ME.token }) : fetch(REG.url + '?action=acts').then(function (r) { return r.json(); });
    return req.then(function (r) {
      PLAN.loading = false;
      if (r && r.ok && Array.isArray(r.acts)) { PLAN.list = r.acts; PLAN.canEdit = !!r.canEdit; PLAN.at = Date.now(); buildEvents(); if (!onChatRoom() && !/^#\/aktivitet(er\/ny|\/[^/]+\/ret)/.test(location.hash)) route(true); }
      else if (r && r.error === 'login') { ME = null; saveMe(); route(true); }
      else if (r && (r.error === 'Ukendt handling' || r.status)) { PLAN.off = true; PLAN.list = []; }   // scriptet er ikke opdateret endnu
    }).catch(function () { PLAN.loading = false; });
  }
  function actById(id) { return (PLAN.list || []).filter(function (a) { return a.id === id; })[0]; }
  function dtTxt(x) { return dTxt(x.slice(0, 10)) + ' kl. ' + x.slice(11, 16); }
  function rangeTxt(a) {
    if (a.start.slice(0, 10) === a.end.slice(0, 10)) return dTxt(a.start.slice(0, 10)) + ' · ' + a.start.slice(11, 16) + (a.end > a.start ? '–' + a.end.slice(11, 16) : '');

        var keep = (old && old.games || []).map(function (g) { return { k: g.k, p: g.p.map(function (id) { return LU.sel[id] ? id : ''; }) }; });
        saveLineup(ti2, mi2, { squad: squad, games: keep }, function () { location.hash = '#/opstilling/' + ti2 + '/' + mi2; });
      });

    if (parts[0] === 'opstilling' && document.getElementById('luSaveGames')) {
      var oti = +parts[1], omi = +parts[2];
      renderWarnings(oti, omi);
      document.querySelectorAll('select[data-slot]').forEach(function (s) { s.addEventListener('change', function () { renderWarnings(oti, omi); }); });
      document.getElementById('luSaveGames').addEventListener('click', function () {
        saveLineup(oti, omi, { games: collectGames(oti), note: document.getElementById('luNote').value.trim(), status: UI.luStatus || undefined }, function () { UI.luStatus = null; route(true); });
      });
    }
    if (parts[0] === 'eksport' && document.getElementById('copyLineup')) {
      var eti = +parts[1], emi = +parts[2];
      document.getElementById('copyLineup').addEventListener('click', function () {
        var ta = document.getElementById('lineupText');
        (navigator.clipboard ? navigator.clipboard.writeText(ta.value) : Promise.reject()).then(function () { toast('Kopieret'); })
          .catch(function () { ta.style.position = 'static'; ta.select(); try { document.execCommand('copy'); toast('Kopieret'); } catch (e) { toast('Markér teksten og kopiér'); } });
      });
      var me2 = document.getElementById('markEntered'); if (me2) me2.addEventListener('click', function () { saveLineup(eti, emi, { status: 'indtastet' }, function () { route(true); }); });
    }
    if (parts[0] === 'ledere' && ME && ME.role && ME.role.admin) {
      var aq = document.getElementById('admQ'); if (aq) aq.addEventListener('input', function (e) { ADM.q = e.target.value; route(true); var x = document.getElementById('admQ'); x.focus(); x.setSelectionRange(x.value.length, x.value.length); });
      var ae = document.getElementById('admEmail'); if (ae) ae.addEventListener('input', function (e) { ADM.email = e.target.value.trim(); });
      var an = document.getElementById('admName'); if (an) an.addEventListener('input', function (e) { ADM.pick.name = e.target.value.trim(); });
      function admSend(teams) {
        var em = (ADM.email || '').toLowerCase();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)) { toast('Skriv en gyldig e-mail'); return; }
        api({ action: 'setLeader', token: ME.token, email: em, name: ADM.pick.name, teams: teams }).then(function (r) {
          if (!r || !r.ok) throw new Error((r && r.error) || 'Kunne ikke gemme');
          toast(teams.length ? 'Holdleder gemt' : 'Fjernet'); ADM.pick = null; ADM.data = null; ADM.email = ''; ADM.teams = {}; route(true);
        }).catch(function (err) { toast(err.message); });
      }
      var as = document.getElementById('admSave'); if (as) as.addEventListener('click', function () { var t = Object.keys(ADM.teams); if (!t.length) { toast('Vælg mindst ét hold'); return; } admSend(t); });
      var ar = document.getElementById('admRemove'); if (ar) ar.addEventListener('click', function () { admSend([]); });
    }
    if (parts[0] === 'turneringer') {
      var tp = document.getElementById('tuPast'); if (tp) tp.addEventListener('change', function (e) { TU.past = e.target.checked; route(true); });
      bindTourFilters();
    }
  }
  var prevHash = null;
  window.addEventListener('hashchange', function () {
    var parts = location.hash.replace(/^#\/?/, '').split('/');
    if (parts[0] === 'hold' && parts.length === 2 && !(prevHash || '').startsWith('#/hold/' + parts[1])) UI.seg = 'kampe';
    prevHash = location.hash;
    route(); $main.scrollTop = 0;
  });
  document.getElementById('back').addEventListener('click', function () {
    if (location.hash.indexOf('#/tilmeld') === 0 && (!ME || !ME.token) && UI.step && UI.step !== 'name') {
      UI.step = UI.step === 'code' ? 'email' : UI.step === 'email' && UI.pending && UI.pending.kids && UI.pending.kids.length ? 'parent' : 'name'; route(); return;
    }
    if (history.length > 1) history.back(); else location.hash = '#/hold';
  });
  $main.addEventListener('click', function (e) {
    var b = e.target.closest('[data-go],[data-seg],[data-metric],[data-filter],[data-reg],[data-me],[data-act],[data-group],[data-tuage],[data-pick],[data-lustatus],[data-lufilter],[data-admpick],[data-admedit],[data-admemail],[data-admteam],[data-admcancel],[data-follow],[data-tfreg],[data-tulvl],[data-pf],[data-trg],[data-trh],[data-mhold],[data-msgdel],[data-newsto],[data-newsdel],[data-kid],[data-sign],[data-actto],[data-taskdel]');
    if (!b) return;
    if (b.dataset.kid) { toggleKid(b.dataset.kid); return; }
    if (b.dataset.sign) { signTask(b.dataset.sign); return; }
    if (b.dataset.actto) { toggleAud(PLAN.form, b.dataset.actto); route(true); return; }
    if (b.dataset.taskdel !== undefined) { PLAN.form.tasks.splice(+b.dataset.taskdel, 1); route(true); return; }
    if (b.dataset.act === 'taskadd') { PLAN.form.tasks.push({ title: '', need: 1 }); route(true); var tt = document.querySelectorAll('[data-tt]'); if (tt.length) tt[tt.length - 1].focus(); return; }
    if (b.dataset.act === 'actnew') { actForm(null); return; }
    if (b.dataset.act === 'actedit') { actForm(actById(b.dataset.id)); return; }
    if (b.dataset.act === 'actdel') { delAct(b.dataset.id); return; }
    if (b.dataset.act === 'actsave') { saveAct(); return; }
    if (b.dataset.act === 'parentstart') { UI.step = 'parent'; route(); return; }
    if (b.dataset.act === 'parentnext') { parentNext(); return; }
    if (b.dataset.act === 'kidsave') { saveKids(); return; }
    if (b.dataset.act === 'send') { sendMsg(); return; }
    if (b.dataset.act === 'mute') { toggleMute(); return; }
    if (b.dataset.act === 'newssave') { saveNews(); return; }
    if (b.dataset.msgdel) { delMsg(b.dataset.msgdel); return; }
    if (b.dataset.newsdel) { delNews(b.dataset.newsdel); return; }
    if (b.dataset.newsto) {
      var F = SNAK.nf, k = b.dataset.newsto;
      if (k === '*') F.to = F.to['*'] ? {} : { '*': 1 };
      else { delete F.to['*']; if (F.to[k]) delete F.to[k]; else F.to[k] = 1; }
      route(true); return;
    }
    if (b.dataset.tuage) { TU.age = b.dataset.tuage; if (!b.dataset.go) { route(true); return; } }
    if (b.dataset.pick) { var pid = b.dataset.pick; if (LU.sel[pid]) delete LU.sel[pid]; else LU.sel[pid] = (D.players[pid] ? D.players[pid].name : (availMap(matchEid(D.teams[LU.team].matches[LU.mi]))[pid] || {}).n || pid); route(true); return; }
    if (b.dataset.lufilter) { LU[b.dataset.lufilter] = !LU[b.dataset.lufilter]; route(true); return; }
    if (b.dataset.lustatus) { UI.luStatus = b.dataset.lustatus; document.querySelectorAll('[data-lustatus]').forEach(function (x) { x.setAttribute('aria-selected', x === b); }); return; }
    if (b.dataset.admpick) { ADM.pick = b.dataset.admpick === '__new' ? { id: '__new', name: 'Ny holdleder' } : { id: b.dataset.admpick, name: D.players[b.dataset.admpick].name }; var ke = (ADM.data.emails || {})[ADM.pick.id] || []; ADM.email = ke[0] || ''; ADM.teams = {}; route(true); return; }
    if (b.dataset.admedit !== undefined) { var L = ADM.data.leaders[+b.dataset.admedit]; ADM.pick = { id: '__edit', name: L.name || L.email }; ADM.email = L.email; ADM.teams = {}; L.teams.forEach(function (x) { ADM.teams[x] = 1; }); route(true); return; }
    if (b.dataset.admemail) { ADM.email = b.dataset.admemail; route(true); return; }
    if (b.dataset.admteam) { var tl = b.dataset.admteam; if (ADM.teams[tl]) delete ADM.teams[tl]; else ADM.teams[tl] = 1; route(true); return; }
    if (b.dataset.admcancel) { ADM.pick = null; ADM.email = ''; ADM.teams = {}; route(true); return; }
    if (b.dataset.follow) { toggleFollow(b.dataset.follow); return; }
    if (b.dataset.tulvl) {
      TF.lv = TF.lv || {};
      var cur = TF.lv[TU.age] || [], lv = b.dataset.tulvl, li = cur.indexOf(lv);

      TF.lv[TU.age] = cur; saveTF(); route(true); return;
    }
    if (b.dataset.tfreg) {
      var rg = b.dataset.tfreg, ri = TF.regions.indexOf(rg);
      if (rg === '__alle') TF.regions = []; else if (ri >= 0) TF.regions.splice(ri, 1); else TF.regions.push(rg);
      saveTF(); route(true); return;
    }
    if (b.dataset.reg) { sendReg(b.dataset.reg, b.dataset.eid, b.dataset.status, b.dataset.label); return; }
    if (b.dataset.me) { setMe(b.dataset.me, D.players[b.dataset.me].name); return; }
    if (b.dataset.act === 'logout') {
      if (REG.url && ME && ME.token) {
        var tok = ME.token;
        // Notifikationer hører til den indloggede — afmeld denne telefon ved log ud
        (swReg && PUSH.state === 'til' ? swReg.pushManager.getSubscription().then(function (sub) {
          if (!sub) return; var j = sub.toJSON(); return sub.unsubscribe().then(function () { return api({ action: 'push', token: tok, on: false, sub: j }); });
        }).catch(function () {}) : Promise.resolve()).then(function () { PUSH.state = 'fra'; return api({ action: 'logout', token: tok }); }).catch(function () {});
      }
      ME = null; saveMe(); UI.step = 'name'; SNAK.rooms = null; SNAK.news = []; SNAK.msgs = {}; SNAK.canNews = false; UI.kids = {}; UI.kidsEdit = false; PLAN.list = null; PLAN.canEdit = false; buildEvents(); updDot(); toast('Du er logget ud'); route(); return;
    }
    if (b.dataset.trg) { CAL.trGroup = b.dataset.trg; CAL.trHold = ''; try { localStorage.setItem('hoebk_trg', CAL.trGroup); localStorage.setItem('hoebk_trh', ''); } catch (e3) {} route(true); return; }

      renderPlayerList(); return;

    if (b.dataset.act === 'pushon') { pushOn(); return; }
    if (b.dataset.act === 'pushoff') { pushOff(); return; }
    if (b.dataset.group) {
      var gi = ME.groups.indexOf(b.dataset.group);
      if (gi >= 0) ME.groups.splice(gi, 1); else ME.groups.push(b.dataset.group);
      saveMe(); route(true); SNAK.at = 0; loadRooms(true); return;

    if (b.dataset.go) { location.hash = b.dataset.go; return; }

  document.getElementById('refresh').addEventListener('click', function () {
    var btn = this; if (btn.classList.contains('spin')) return;
    btn.classList.add('spin'); FORCE = Date.now();
    checkAppVersion(true).then(function (reloading) {
      if (reloading) { toast('Ny version af appen — genindlæser…'); return new Promise(function () {}); }
      loadActivities(true);
      return load();
    }).then(function () { return loadReg(); })
      .then(function () { route(true); SNAK.pub = null; loadPub(); var rm = curRoom(); if (rm && ME && ME.token) fetchMsgs(rm, true); loadActs(true); return loadRooms(true); })
      .then(function () { toast('Opdateret'); })
      .catch(function () { toast('Kunne ikke opdatere — tjek forbindelsen'); })
      .then(function () { btn.classList.remove('spin'); FORCE = 0; });
  });
  // Når appen åbnes igen fra baggrunden: tjek for ny version, og hent data hvis de er mere end 10 min gamle.
  var lastLoad = Date.now();
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    checkAppVersion(false).then(function (reloading) {
      if (!reloading) { loadRooms(true); var rm = curRoom(); if (rm && ME && ME.token) fetchMsgs(rm, true); }
      if (reloading || Date.now() - lastLoad < 10 * 60000) return;
      lastLoad = Date.now(); FORCE = Date.now();
      load().then(function () { return loadReg(); }).then(function () { route(true); }).catch(function () {}).then(function () { FORCE = 0; });
    });
  });
  setTimeout(function () { checkAppVersion(false); }, 1500);
  // Nyt er startsiden — også for hjemmeskærms-ikoner installeret med en gammel start-adresse (#/hold eller #/tilmeld)
  if (!location.hash || location.hash === '#/' || (!(typeof APP_RELOAD !== 'undefined' && APP_RELOAD) && /^#\/(hold|tilmeld)$/.test(location.hash))) {
    try { history.replaceState(null, '', location.pathname + location.search + '#/nyt'); } catch (e) { location.hash = '#/nyt'; }
  }

  load().then(function () { prevHash = location.hash; route(); loadActivities(); return loadReg(); }).then(function () { route(true); return refreshRole(); }).then(function () { loadActs(true); return loadRooms(true); }).catch(function () {
    $main.innerHTML = '<p class="empty">Kunne ikke hente data. Prøv igen om lidt.</p>';
    document.getElementById('subtitle').textContent = 'Fejl ved hentning';
  });
})();
